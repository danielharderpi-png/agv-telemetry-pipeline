name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go-pipeline:
    name: Go Pipeline (vet, build, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: pipeline/go.sum

      - name: Run go vet
        run: go vet ./...

      - name: Run go build
        run: go build ./...

      - name: Run unit tests with race detector
        run: go test -v -race ./...

  python-simulator:
    name: Python Simulator (syntax check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile-check simulator
        run: python -m py_compile simulator/producer.py
